<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Craft (ThinkPad Optimized)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #78a7ff;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            mix-blend-mode: difference;
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
        
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
        }
        .slot {
            width: 40px;
            height: 40px;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px 0px #000;
        }
        .slot.active {
            border-color: #fff;
            background: rgba(255,255,255,0.2);
        }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            line-height: 1.4;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">
        <strong>CONTROLS:</strong><br>
        Click Screen: Lock mouse & Play<br>
        WASD: Move | Space: Jump<br>
        M: Place Block | N: Break Block<br>
        1 - 6: Select Hotbar Slot<br>
        H: Toggle Hitboxes / Wireframe<br>
        ESC: Pause / Free Mouse
    </div>

    <div id="ui">
        <div class="slot active" id="slot0" style="background-color: #557a2b;">Grass</div>
        <div class="slot" id="slot1" style="background-color: #866043;">Dirt</div>
        <div class="slot" id="slot2" style="background-color: #737373;">Stone</div>
        <div class="slot" id="slot3" style="background-color: #378221;">Leaves</div>
        <div class="slot" id="slot4" style="background-color: #9c774c;">Wood</div>
        <div class="slot" id="slot5" style="background-color: #e3cb8c; color: #333;">Sand</div>
    </div>

    <script>
        // --- GAME CONFIG & BLOCK TYPES ---
        const WORLD_SIZE = 64;
        const CHUNK_DEPTH = 16;
        const BLOCK_SIZE = 1;
        
        const BLOCK_TYPES = {
            1: { name: 'Grass', color: 0x557a2b, noiseFactor: 0.1 },
            2: { name: 'Dirt', color: 0x866043 },
            3: { name: 'Stone', color: 0x737373 },
            4: { name: 'Leaves', color: 0x378221 },
            5: { name: 'Wood', color: 0x9c774c },
            6: { name: 'Sand', color: 0xe3cb8c }
        };

        let selectedBlockType = 1; 
        const inventory = [1, 2, 3, 4, 5, 6];

        // --- PROCEDURAL TEXTURE GENERATOR (Minecraft Style Pixelation) ---
        function createBlockTexture(baseColorHex, noiseIntensity = 0.15) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            
            const baseColor = new THREE.Color(baseColorHex);
            
            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    const noise = (Math.random() - 0.5) * noiseIntensity;
                    const c = baseColor.clone().addScalar(noise);
                    ctx.fillStyle = `rgb(${Math.floor(c.r * 255)}, ${Math.floor(c.g * 255)}, ${Math.floor(c.b * 255)})`;
                    ctx.fillRect(x, y, 1, 1);
                    
                    // Add a slight border grid highlight to distinguish blocks cleanly
                    if(x === 0 || y === 0 || x === 15 || y === 15) {
                        ctx.fillStyle = `rgba(0,0,0,0.05)`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        // --- INITIALIZATION ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff);
        scene.fog = new THREE.FogExp2(0x78a7ff, 0.025);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // False for retro pixel optimization
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(20, 40, 20);
        scene.add(directionalLight);

        // World Data structures
        const worldBlocks = {}; 
        const blockMeshes = {}; 
        
        function blockKey(x, y, z) { return `${x},${y},${z}`; }

        // Materials cache
        const materials = {};
        const wireframeMaterials = {};
        Object.keys(BLOCK_TYPES).forEach(id => {
            const texture = createBlockTexture(BLOCK_TYPES[id].color, id == 4 || id == 3 ? 0.25 : 0.12);
            materials[id] = new THREE.MeshLambertMaterial({ map: texture });
            wireframeMaterials[id] = new THREE.MeshBasicMaterial({ color: BLOCK_TYPES[id].color, wireframe: true });
        });

        const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

        // --- WORLD GENERATION (Sine-wave hill structure + Trees + Sand borders) ---
        function generateWorld() {
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    
                    // Simplified Math.sin terrain formula representing genuine rolling hills
                    let height = Math.floor(
                        (Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3) + 
                        (Math.sin(x * 0.05) * 4) + 8
                    );
                    
                    if (height < 3) height = 3; // Ensure safety floor

                    for (let y = 0; y <= height; y++) {
                        let type = 3; // Default: Stone

                        if (y === height) {
                            // If low enough down, turn it into a sandy beach shoreline
                            type = (y < 6) ? 6 : 1; // Sand or Grass
                        } else if (y > height - 3) {
                            type = 2; // Dirt under grass
                        }
                        
                        spawnBlock(x, y, z, type);
                    }

                    // Procedural Tree generation (Spawn randomly on Grass beds)
                    if (x > 2 && x < WORLD_SIZE - 3 && z > 2 && z < WORLD_SIZE - 3 && Math.random() < 0.015) {
                        let groundHeight = height;
                        if(worldBlocks[blockKey(x, groundHeight, z)] === 1) { // Must be grass
                            // Grow Trunk
                            let trunkHeight = 4 + Math.floor(Math.random() * 2);
                            for(let th = 1; th <= trunkHeight; th++) {
                                spawnBlock(x, groundHeight + th, z, 5); // Wood
                            }
                            // Grow Foliage/Leaves capsule
                            let leafBase = groundHeight + trunkHeight - 1;
                            for(let lx = -2; lx <= 2; lx++) {
                                for(let lz = -2; lz <= 2; lz++) {
                                    for(let ly = 0; ly <= 3; ly++) {
                                        if(Math.abs(lx) === 2 && Math.abs(lz) === 2 && ly > 1) continue; // Shave corners
                                        if(lx === 0 && lz === 0 && ly < 2) continue; // skip trunk internals
                                        
                                        let bKey = blockKey(x + lx, leafBase + ly, z + lz);
                                        if(!worldBlocks[bKey]) {
                                            spawnBlock(x + lx, leafBase + ly, z + lz, 4); // Leaves
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        let showHitboxes = false;
        function spawnBlock(x, y, z, type) {
            const key = blockKey(x, y, z);
            worldBlocks[key] = type;

            const mesh = new THREE.Mesh(geometry, showHitboxes ? wireframeMaterials[type] : materials[type]);
            mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
            scene.add(mesh);
            blockMeshes[key] = mesh;
        }

        function removeBlock(x, y, z) {
            const key = blockKey(x, y, z);
            if (worldBlocks[key]) {
                scene.remove(blockMeshes[key]);
                delete worldBlocks[key];
                delete blockMeshes[key];
                return true;
            }
            return false;
        }

        generateWorld();

        // --- PLAYER VARIABLES & PHYSICS PHYSICS ---
        let player = {
            pos: new THREE.Vector3(32, 15, 32),
            velocity: new THREE.Vector3(),
            width: 0.6,
            height: 1.8,
            onGround: false
        };
        camera.position.copy(player.pos).y += player.height - 0.2;

        const GRAVITY = -22.0;
        const JUMP_FORCE = 8.5;
        const SPEED = 5.0;
        let clock = new THREE.Clock();

        // --- CONTROLS & POINTER LOCK ---
        let keys = {};
        let isLocked = false;

        document.body.addEventListener('click', () => {
            if(!isLocked) document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
        });

        // Mouse Looking Sensitivity
        let pitch = 0, yaw = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.0025;
            pitch -= e.movementY * 0.0025;
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
            
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            // Hotbar Slots 1-6
            if (['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].includes(e.code)) {
                let index = parseInt(e.key) - 1;
                selectedBlockType = inventory[index];
                document.querySelectorAll('.slot').forEach((s, idx) => {
                    s.classList.toggle('active', idx === index);
                });
            }
            // Toggle hitboxes/wireframe view
            if (e.code === 'KeyH') {
                showHitboxes = !showHitboxes;
                Object.keys(blockMeshes).forEach(key => {
                    let type = worldBlocks[key];
                    blockMeshes[key].material = showHitboxes ? wireframeMaterials[type] : materials[type];
                });
            }
            // Intercept Actions
            if (e.code === 'KeyM') placeBlockFromRaycast();
            if (e.code === 'KeyN') breakBlockFromRaycast();
        });

        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // --- COLLISION DETECTOR (AABB Voxel Check) ---
        function checkCollision(pos) {
            let pMinX = pos.x - player.width / 2;
            let pMaxX = pos.x + player.width / 2;
            let pMinY = pos.y;
            let pMaxY = pos.y + player.height;
            let pMinZ = pos.z - player.width / 2;
            let pMaxZ = pos.z + player.width / 2;

            let minBlockX = Math.floor(pMinX);
            let maxBlockX = Math.floor(pMaxX);
            let minBlockY = Math.floor(pMinY);
            let maxBlockY = Math.floor(pMaxY);
            let minBlockZ = Math.floor(pMinZ);
            let maxBlockZ = Math.floor(pMaxZ);

            for (let x = minBlockX; x <= maxBlockX; x++) {
                for (let y = minBlockY; y <= maxBlockY; y++) {
                    for (let z = minBlockZ; z <= maxBlockZ; z++) {
                        if (worldBlocks[blockKey(x, y, z)]) {
                            return true; // Collision detected!
                        }
                    }
                }
            }
            return false;
        }

        // --- RAYCASTING (Target block detection for M and N) ---
        const raycaster = new THREE.Raycaster();
        const centerMouse = new THREE.Vector2(0, 0); // Always center screen center

        function getTargetBlock() {
            raycaster.setFromCamera(centerMouse, camera);
            // Limit reach distance to 5 blocks deep
            const intersects = raycaster.intersectObjects(scene.children);
            
            if (intersects.length > 0 && intersects[0].distance < 6) {
                let intersect = intersects[0];
                // Target block coordinate matching mapping keys
                let p = intersect.point.clone().sub(intersect.face.normal.clone().multiplyScalar(0.5));
                let blockPos = new THREE.Vector3(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z));
                
                // Adjacent empty target space (perfect for building)
                let buildPos = blockPos.clone().add(intersect.face.normal);
                return { blockPos, buildPos };
            }
            return null;
        }

        function breakBlockFromRaycast() {
            if (!isLocked) return;
            let target = getTargetBlock();
            if (target) {
                removeBlock(target.blockPos.x, target.blockPos.y, target.blockPos.z);
            }
        }

        function placeBlockFromRaycast() {
            if (!isLocked) return;
            let target = getTargetBlock();
            if (target) {
                // Ensure player isn't occupying building space directly
                let b = target.buildPos;
                let key = blockKey(b.x, b.y, b.z);
                if (!worldBlocks[key]) {
                    // Quick simulation check preventing building inside our face
                    let tempMesh = new THREE.Mesh(geometry);
                    tempMesh.position.set(b.x + 0.5, b.y + 0.5, b.z + 0.5);
                    
                    spawnBlock(b.x, b.y, b.z, selectedBlockType);
                }
            }
        }

        // --- SAND GRAVITY SIMULATION ---
        let sandTimer = 0;
        function updateSandGravity() {
            // Run system sweep checking for floating Sand block units (ID: 6) every 0.15s safely
            Object.keys(worldBlocks).forEach(key => {
                if (worldBlocks[key] === 6) { 
                    let parts = key.split(',').map(Number);
                    let x = parts[0], y = parts[1], z = parts[2];
                    
                    let floorKey = blockKey(x, y - 1, z);
                    if (y > 0 && !worldBlocks[floorKey]) {
                        // Drop Sand Downwards smoothly
                        removeBlock(x, y, z);
                        spawnBlock(x, y - 1, z, 6);
                    }
                }
            });
        }

        // --- ENGINE FRAME TICK LOOP ---
        function update(dt) {
            if (dt > 0.1) dt = 0.1; // Absorb background micro-stutter lag spikes

            // 1. Sand Falling Tick Controller
            sandTimer += dt;
            if(sandTimer > 0.15) {
                updateSandGravity();
                sandTimer = 0;
            }

            // 2. Physics & Gravity operations
            player.velocity.y += GRAVITY * dt;

            // Movement vectors setup
            let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            let right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            let moveDirection = new THREE.Vector3();
            if (keys['KeyW']) moveDirection.add(forward);
            if (keys['KeyS']) moveDirection.add(forward.clone().negate());
            if (keys['KeyD']) moveDirection.add(right);
            if (keys['KeyA']) moveDirection.add(right.clone().negate());
            moveDirection.normalize().multiplyScalar(SPEED);

            // X Movement Axis with dedicated collision checking
            player.pos.x += moveDirection.x * dt;
            if (checkCollision(player.pos)) {
                player.pos.x -= moveDirection.x * dt; // Undo movement steps
            }

            // Z Movement Axis with dedicated collision checking
            player.pos.z += moveDirection.z * dt;
            if (checkCollision(player.pos)) {
                player.pos.z -= moveDirection.z * dt; // Undo movement steps
            }

            // Y Movement/Gravity Axis with ground landing calculations
            player.pos.y += player.velocity.y * dt;
            player.onGround = false;
            
            if (checkCollision(player.pos)) {
                player.pos.y -= player.velocity.y * dt; // Undo displacement
                if (player.velocity.y < 0) {
                    player.onGround = true;
                }
                player.velocity.y = 0;
            }

            // Jump command activation
            if (keys['Space'] && player.onGround) {
                player.velocity.y = JUMP_FORCE;
                player.onGround = false;
            }

            // Bind camera setup cleanly over physical body limits
            camera.position.copy(player.pos);
            camera.position.y += player.height - 0.2;
        }

        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta();
            update(dt);
            renderer.render(scene, camera);
        }

        // Adjust resolution resizing elegantly automatically (ThinkPad responsive setup)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
