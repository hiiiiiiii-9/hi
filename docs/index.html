<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Craft - Ultimate Iframe Fix</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #78a7ff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <script>
        const WORLD_SIZE = 64;
        const BLOCK_SIZE = 1;
        
        const BLOCK_TYPES = {
            1: { name: 'Grass', color: '#557a2b', hex: 0x557a2b },
            2: { name: 'Dirt', color: '#866043', hex: 0x866043 },
            3: { name: 'Stone', color: '#737373', hex: 0x737373 },
            4: { name: 'Leaves', color: '#378221', hex: 0x378221 },
            5: { name: 'Wood', color: '#9c774c', hex: 0x9c774c },
            6: { name: 'Sand', color: '#e3cb8c', hex: 0xe3cb8c }
        };

        let selectedBlockType = 1; 
        const inventory = [1, 2, 3, 4, 5, 6];

        // --- 100% RELIABLE TEXTURE GENERATOR ---
        // Generates procedural pixel noise grids directly converted into data arrays
        function createFallbackTexture(id) {
            const size = 16;
            const data = new Uint8Array(size * size * 3);
            const baseColor = new THREE.Color(BLOCK_TYPES[id].hex);
            
            for (let i = 0; i < size * size; i++) {
                const x = i % size;
                const y = Math.floor(i / size);
                
                let noise = (Math.random() - 0.5) * 0.2;
                let c = baseColor.clone().addScalar(noise);
                
                // Block type unique texturing patterns
                if (id === 1 && y < 4) {
                    c = new THREE.Color(0x557a2b).addScalar((Math.random() - 0.5) * 0.1);
                } else if (id === 5 && (x === 0 || x === 15 || y === 4 || y === 11)) {
                    c.multiplyScalar(0.6); 
                }

                const stride = i * 3;
                data[stride]     = Math.floor(c.r * 255);
                data[stride + 1] = Math.floor(c.g * 255);
                data[stride + 2] = Math.floor(c.b * 255);
            }
            
            const texture = new THREE.DataTexture(data, size, size, THREE.RGBFormat);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            texture.needsUpdate = true;
            return texture;
        }

        // --- ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff);
        scene.fog = new THREE.FogExp2(0x78a7ff, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(20, 40, 20);
        scene.add(directionalLight);

        const worldBlocks = {}; 
        const blockMeshes = {}; 
        function blockKey(x, y, z) { return `${x},${y},${z}`; }

        const materials = {};
        const wireframeMaterials = {};
        
        Object.keys(BLOCK_TYPES).forEach(id => {
            materials[id] = new THREE.MeshLambertMaterial({ map: createFallbackTexture(parseInt(id)) });
            wireframeMaterials[id] = new THREE.MeshBasicMaterial({ color: BLOCK_TYPES[id].hex, wireframe: true });
        });

        const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

        // --- CANVAS-BASED 2D HUD (Rendered within WebGL directly) ---
        const hudCanvas = document.createElement('canvas');
        hudCanvas.width = 1024;
        hudCanvas.height = 1024;
        const hudCtx = hudCanvas.getContext('2d');
        
        const hudTexture = new THREE.CanvasTexture(hudCanvas);
        const hudMaterial = new THREE.SpriteMaterial({ map: hudTexture });
        const hudSprite = new THREE.Sprite(hudMaterial);
        
        // Lock to screen camera space
        const hudCamera = new THREE.OrthographicCamera(-512, 512, 512, -512, 1, 10);
        hudSprite.position.set(0, 0, -1);
        hudSprite.scale.set(1024, 1024, 1);
        const hudScene = new THREE.Scene();
        hudScene.add(hudSprite);

        function drawHUD() {
            hudCtx.clearRect(0, 0, 1024, 1024);
            
            // 1. Crosshair
            hudCtx.strokeStyle = 'white';
            hudCtx.lineWidth = 4;
            hudCtx.beginPath();
            hudCtx.moveTo(512 - 15, 512); hudCtx.lineTo(512 + 15, 512);
            hudCtx.moveTo(512, 512 - 15); hudCtx.lineTo(512, 512 + 15);
            hudCtx.stroke();

            // 2. Button Guide Box
            hudCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            hudCtx.fillRect(20, 20, 420, 240);
            hudCtx.fillStyle = 'white';
            hudCtx.font = 'bold 20px Courier New';
            hudCtx.fillText("CONTROLS (github.dev Native Fix):", 30, 50);
            hudCtx.font = '18px Courier New';
            hudCtx.fillText("• Click Screen : Focus Game Frame", 30, 85);
            hudCtx.fillText("• Hold SHIFT   : Mouse Look Fallback", 30, 115);
            hudCtx.fillText("• WASD / SPACE : Move and Jump", 30, 145);
            hudCtx.fillText("• M / N        : Place / Break Block", 30, 175);
            hudCtx.fillText("• 1 to 6       : Switch Slots", 30, 205);
            hudCtx.fillText("• H            : Wireframe Hitboxes", 30, 235);

            // 3. Hotbar Selector Rendering
            let startX = 512 - (6 * 65) / 2;
            for (let i = 0; i < 6; i++) {
                let x = startX + (i * 65);
                let y = 930;
                let bId = inventory[i];

                // Check active status outline
                hudCtx.fillStyle = (bId === selectedBlockType) ? 'rgba(255, 255, 255, 0.4)' : 'rgba(0, 0, 0, 0.6)';
                hudCtx.fillRect(x, y, 60, 60);
                hudCtx.strokeStyle = (bId === selectedBlockType) ? '#ffffff' : '#555555';
                hudCtx.lineWidth = (bId === selectedBlockType) ? 4 : 2;
                hudCtx.strokeRect(x, y, 60, 60);

                // Inline color icon badge
                hudCtx.fillStyle = BLOCK_TYPES[bId].color;
                hudCtx.fillRect(x + 5, y + 5, 20, 20);

                // Slot text tag
                hudCtx.fillStyle = 'white';
                hudCtx.font = '14px Courier New';
                hudCtx.fillText(BLOCK_TYPES[bId].name, x + 5, y + 48);
                hudCtx.fillText(i + 1, x + 45, y + 20);
            }
            hudTexture.needsUpdate = true;
        }

        // --- WORLD GENERATION ---
        function generateWorld() {
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    let height = Math.floor((Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3) + (Math.sin(x * 0.05) * 4) + 8);
                    if (height < 3) height = 3;

                    for (let y = 0; y <= height; y++) {
                        let type = 3; // Stone
                        if (y === height) {
                            type = (y < 6) ? 6 : 1; // Sand or Grass Bed
                        } else if (y > height - 3) {
                            type = 2; // Dirt core
                        }
                        spawnBlock(x, y, z, type);
                    }

                    // Trees
                    if (x > 2 && x < WORLD_SIZE - 3 && z > 2 && z < WORLD_SIZE - 3 && Math.random() < 0.02) {
                        if(worldBlocks[blockKey(x, height, z)] === 1) {
                            let trunkHeight = 4 + Math.floor(Math.random() * 2);
                            for(let th = 1; th <= trunkHeight; th++) {
                                spawnBlock(x, height + th, z, 5);
                            }
                            let leafBase = height + trunkHeight - 1;
                            for(let lx = -2; lx <= 2; lx++) {
                                for(let lz = -2; lz <= 2; lz++) {
                                    for(let ly = 0; ly <= 3; ly++) {
                                        if(Math.abs(lx) === 2 && Math.abs(lz) === 2 && ly > 1) continue;
                                        if(lx === 0 && lz === 0 && ly < 2) continue;
                                        let bKey = blockKey(x + lx, leafBase + ly, z + lz);
                                        if(!worldBlocks[bKey]) spawnBlock(x + lx, leafBase + ly, z + lz, 4);
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        let showHitboxes = false;
        function spawnBlock(x, y, z, type) {
            const key = blockKey(x, y, z);
            if(worldBlocks[key]) removeBlock(x,y,z);
            worldBlocks[key] = type;
            const mesh = new THREE.Mesh(geometry, showHitboxes ? wireframeMaterials[type] : materials[type]);
            mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
            scene.add(mesh);
            blockMeshes[key] = mesh;
        }

        function removeBlock(x, y, z) {
            const key = blockKey(x, y, z);
            if (worldBlocks[key]) {
                scene.remove(blockMeshes[key]);
                delete worldBlocks[key];
                delete blockMeshes[key];
                return true;
            }
            return false;
        }

        generateWorld();

        // --- PLAYER & PHYSICS ---
        let player = {
            pos: new THREE.Vector3(32, 18, 32),
            velocity: new THREE.Vector3(),
            width: 0.5,
            height: 1.8,
            onGround: false
        };
        camera.position.copy(player.pos).y += player.height - 0.2;

        const GRAVITY = -20.0;
        const JUMP_FORCE = 8.0;
        const SPEED = 5.0;
        let clock = new THREE.Clock();

        let keys = {};
        let isLocked = false;

        // Forced frame focus grabbers
        window.addEventListener('click', () => {
            window.focus();
            document.body.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
        });

        // Trackball look angles
        let pitch = 0, yaw = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked && !keys['ShiftLeft'] && !keys['ShiftRight']) return;
            yaw -= e.movementX * 0.003;
            pitch -= e.movementY * 0.003;
            pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].includes(e.code)) {
                let index = parseInt(e.key) - 1;
                selectedBlockType = inventory[index];
                drawHUD();
            }
            if (e.code === 'KeyH') {
                showHitboxes = !showHitboxes;
                Object.keys(blockMeshes).forEach(key => {
                    let type = worldBlocks[key];
                    blockMeshes[key].material = showHitboxes ? wireframeMaterials[type] : materials[type];
                });
            }
            if (e.code === 'KeyM') placeBlockFromRaycast();
            if (e.code === 'KeyN') breakBlockFromRaycast();
        });

        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function checkCollision(pos) {
            let pMinX = pos.x - player.width / 2;
            let pMaxX = pos.x + player.width / 2;
            let pMinY = pos.y;
            let pMaxY = pos.y + player.height;
            let pMinZ = pos.z - player.width / 2;
            let pMaxZ = pos.z + player.width / 2;

            for (let x = Math.floor(pMinX); x <= Math.floor(pMaxX); x++) {
                for (let y = Math.floor(pMinY); y <= Math.floor(pMaxY); y++) {
                    for (let z = Math.floor(pMinZ); z <= Math.floor(pMaxZ); z++) {
                        if (worldBlocks[blockKey(x, y, z)]) return true;
                    }
                }
            }
            return false;
        }

        const raycaster = new THREE.Raycaster();
        const centerMouse = new THREE.Vector2(0, 0);

        function getTargetBlock() {
            raycaster.setFromCamera(centerMouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);
            if (intersects.length > 0 && intersects[0].distance < 6) {
                let intersect = intersects[0];
                let p = intersect.point.clone().sub(intersect.face.normal.clone().multiplyScalar(0.5));
                let blockPos = new THREE.Vector3(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z));
                let buildPos = blockPos.clone().add(intersect.face.normal);
                return { blockPos, buildPos };
            }
            return null;
        }

        function breakBlockFromRaycast() {
            let target = getTargetBlock();
            if (target) removeBlock(target.blockPos.x, target.blockPos.y, target.blockPos.z);
        }

        function placeBlockFromRaycast() {
            let target = getTargetBlock();
            if (target) {
                let b = target.buildPos;
                if (!worldBlocks[blockKey(b.x, b.y, b.z)]) {
                    spawnBlock(b.x, b.y, b.z, selectedBlockType);
                }
            }
        }

        let sandTimer = 0;
        function updateSandGravity() {
            Object.keys(worldBlocks).forEach(key => {
                if (worldBlocks[key] === 6) { 
                    let parts = key.split(',').map(Number);
                    let x = parts[0], y = parts[1], z = parts[2];
                    if (y > 0 && !worldBlocks[blockKey(x, y - 1, z)]) {
                        removeBlock(x, y, z);
                        spawnBlock(x, y - 1, z, 6);
                    }
                }
            });
        }

        // --- TICK EXECUTION ---
        function update(dt) {
            if (dt > 0.1) dt = 0.1;

            sandTimer += dt;
            if(sandTimer > 0.15) {
                updateSandGravity();
                sandTimer = 0;
            }

            player.velocity.y += GRAVITY * dt;

            let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            let right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            let moveDirection = new THREE.Vector3();
            if (keys['KeyW']) moveDirection.add(forward);
            if (keys['KeyS']) moveDirection.add(forward.clone().negate());
            if (keys['KeyD']) moveDirection.add(right);
            if (keys['KeyA']) moveDirection.add(right.clone().negate());
            moveDirection.normalize().multiplyScalar(SPEED);

            player.pos.x += moveDirection.x * dt;
            if (checkCollision(player.pos)) player.pos.x -= moveDirection.x * dt;

            player.pos.z += moveDirection.z * dt;
            if (checkCollision(player.pos)) player.pos.z -= moveDirection.z * dt;

            player.pos.y += player.velocity.y * dt;
            player.onGround = false;
            if (checkCollision(player.pos)) {
                player.pos.y -= player.velocity.y * dt;
                if (player.velocity.y < 0) player.onGround = true;
                player.velocity.y = 0;
            }

            if (keys['Space'] && player.onGround) {
                player.velocity.y = JUMP_FORCE;
                player.onGround = false;
            }

            camera.position.copy(player.pos);
            camera.position.y += player.height - 0.2;
        }

        // Initialize HUD Graphic Layer first
        drawHUD();

        function animate() {
            requestAnimationFrame(animate);
            update(clock.getDelta());
            
            // Render 3D World Space
            renderer.clear();
            renderer.render(scene, camera);
            
            // Overlay HUD layer
            renderer.clearDepth();
            renderer.render(hudScene, hudCamera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.autoClear = false;
        animate();
    </script>
</body>
</html>
