<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Craft - Full Textures Enabled</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #78a7ff;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            mix-blend-mode: difference;
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
        
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
        }
        .slot {
            width: 55px;
            height: 45px;
            border: 2px solid #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 10px;
            text-shadow: 1px 1px 0px #000;
        }
        .slot.active {
            border-color: #fff;
            background: rgba(255,255,255,0.2);
        }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 12px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            line-height: 1.4;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">
        <strong>CONTROLS:</strong><br>
        • Click Screen: Focus Game / Lock Mouse<br>
        • <em>If mouse doesn't lock, hold <strong>SHIFT</strong> to look around!</em><br>
        • WASD: Move | Space: Jump<br>
        • M: Place Block | N: Break Block<br>
        • 1 - 6: Select Hotbar Slot<br>
        • H: Toggle Hitboxes & Wireframes<br>
        • ESC: Free Mouse Cursor
    </div>

    <div id="ui">
        <div class="slot active" id="slot0" style="background-color: #557a2b;">Grass</div>
        <div class="slot" id="slot1" style="background-color: #866043;">Dirt</div>
        <div class="slot" id="slot2" style="background-color: #737373;">Stone</div>
        <div class="slot" id="slot3" style="background-color: #378221;">Leaves</div>
        <div class="slot" id="slot4" style="background-color: #9c774c;">Wood</div>
        <div class="slot" id="slot5" style="background-color: #e3cb8c; color: #333;">Sand</div>
    </div>

    <script>
        const WORLD_SIZE = 64;
        const BLOCK_SIZE = 1;
        
        const BLOCK_TYPES = {
            1: { name: 'Grass', color: 0x557a2b, noise: 0.15 },
            2: { name: 'Dirt', color: 0x866043, noise: 0.15 },
            3: { name: 'Stone', color: 0x737373, noise: 0.20 },
            4: { name: 'Leaves', color: 0x378221, noise: 0.30 },
            5: { name: 'Wood', color: 0x9c774c, noise: 0.15 },
            6: { name: 'Sand', color: 0xe3cb8c, noise: 0.10 }
        };

        let selectedBlockType = 1; 
        const inventory = [1, 2, 3, 4, 5, 6];

        // --- RETRO 16x16 MINECRAFT TEXTURE GENERATOR ---
        function createMinecraftTexture(id) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            
            const config = BLOCK_TYPES[id];
            const baseColor = new THREE.Color(config.color);
            
            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    let currentNoise = (Math.random() - 0.5) * config.noise;
                    let c = baseColor.clone().addScalar(currentNoise);
                    
                    // Specific stylistic patterns for specific blocks
                    if (id == 1 && y < 4) { 
                        // Grass top layer behavior
                        let grassNoise = (Math.random() - 0.5) * 0.1;
                        c = new THREE.Color(0x557a2b).addScalar(grassNoise);
                    } else if (id == 1 && y >= 4 && y < 6 && Math.random() > 0.5) {
                        // Grass hanging dirt fringe pattern
                        let grassNoise = (Math.random() - 0.5) * 0.1;
                        c = new THREE.Color(0x557a2b).addScalar(grassNoise);
                    } else if (id == 5) {
                        // Wood rings / plank line simulation
                        if (x === 0 || x === 15 || y === 4 || y === 11) {
                            c.multiplyScalar(0.7); // Dark wood rings
                        }
                    } else if (id == 4) {
                        // Leaves transparency simulation patterns
                        if (Math.random() > 0.85) {
                            ctx.fillStyle = 'rgba(0,0,0,0)'; // Leaf gaps
                            continue;
                        }
                    }

                    ctx.fillStyle = `rgb(${Math.floor(c.r * 255)}, ${Math.floor(c.g * 255)}, ${Math.floor(c.b * 255)})`;
                    ctx.fillRect(x, y, 1, 1);
                    
                    // Darken borders slightly to create clean separation lines between grid blocks
                    if(x === 0 || y === 0 || x === 15 || y === 15) {
                        ctx.fillStyle = `rgba(0,0,0,0.08)`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            // Crucial: NearestFilter stops the graphics engine from blurring textures, keeping them sharp and pixelated
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // --- ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff);
        scene.fog = new THREE.FogExp2(0x78a7ff, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.55);
        directionalLight.position.set(20, 40, 20);
        scene.add(directionalLight);

        const worldBlocks = {}; 
        const blockMeshes = {}; 
        function blockKey(x, y, z) { return `${x},${y},${z}`; }

        const materials = {};
        const wireframeMaterials = {};
        
        // Cache our custom procedural textures
        Object.keys(BLOCK_TYPES).forEach(id => {
            const texture = createMinecraftTexture(id);
            materials[id] = new THREE.MeshLambertMaterial({ 
                map: texture,
                transparent: id == 4 ? true : false, // Enable transparency for leaves
                side: THREE.DoubleSide
            });
            wireframeMaterials[id] = new THREE.MeshBasicMaterial({ color: BLOCK_TYPES[id].color, wireframe: true });
        });

        const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

        // --- WORLD GENERATION ---
        function generateWorld() {
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    let height = Math.floor((Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3) + (Math.sin(x * 0.05) * 4) + 8);
                    if (height < 3) height = 3;

                    for (let y = 0; y <= height; y++) {
                        let type = 3; // Stone
                        if (y === height) {
                            type = (y < 6) ? 6 : 1; // Beach Sand or Grass Bed
                        } else if (y > height - 3) {
                            type = 2; // Dirt core
                        }
                        spawnBlock(x, y, z, type);
                    }

                    // Tree Spawner
                    if (x > 2 && x < WORLD_SIZE - 3 && z > 2 && z < WORLD_SIZE - 3 && Math.random() < 0.02) {
                        if(worldBlocks[blockKey(x, height, z)] === 1) {
                            let trunkHeight = 4 + Math.floor(Math.random() * 2);
                            for(let th = 1; th <= trunkHeight; th++) {
                                spawnBlock(x, height + th, z, 5); // Wood log
                            }
                            let leafBase = height + trunkHeight - 1;
                            for(let lx = -2; lx <= 2; lx++) {
                                for(let lz = -2; lz <= 2; lz++) {
                                    for(let ly = 0; ly <= 3; ly++) {
                                        if(Math.abs(lx) === 2 && Math.abs(lz) === 2 && ly > 1) continue;
                                        if(lx === 0 && lz === 0 && ly < 2) continue;
                                        let bKey = blockKey(x + lx, leafBase + ly, z + lz);
                                        if(!worldBlocks[bKey]) spawnBlock(x + lx, leafBase + ly, z + lz, 4); // Leaves
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        let showHitboxes = false;
        function spawnBlock(x, y, z, type) {
            const key = blockKey(x, y, z);
            if(worldBlocks[key]) removeBlock(x,y,z);
            worldBlocks[key] = type;
            const mesh = new THREE.Mesh(geometry, showHitboxes ? wireframeMaterials[type] : materials[type]);
            mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
            scene.add(mesh);
            blockMeshes[key] = mesh;
        }

        function removeBlock(x, y, z) {
            const key = blockKey(x, y, z);
            if (worldBlocks[key]) {
                scene.remove(blockMeshes[key]);
                delete worldBlocks[key];
                delete blockMeshes[key];
                return true;
            }
            return false;
        }

        generateWorld();

        // --- PLAYER & PHYSICS CONFIG ---
        let player = {
            pos: new THREE.Vector3(32, 18, 32),
            velocity: new THREE.Vector3(),
            width: 0.5,
            height: 1.8,
            onGround: false
        };
        camera.position.copy(player.pos).y += player.height - 0.2;

        const GRAVITY = -20.0;
        const JUMP_FORCE = 8.0;
        const SPEED = 5.0;
        let clock = new THREE.Clock();

        let keys = {};
        let isLocked = false;

        // Force focus to iframe container window
        window.addEventListener('click', () => {
            window.focus();
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
        });

        // Looking logic + IFrame fallback mechanics
        let pitch = 0, yaw = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked && !keys['ShiftLeft'] && !keys['ShiftRight']) return;
            
            yaw -= e.movementX * 0.003;
            pitch -= e.movementY * 0.003;
            pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].includes(e.code)) {
                let index = parseInt(e.key) - 1;
                selectedBlockType = inventory[index];
                document.querySelectorAll('.slot').forEach((s, idx) => {
                    s.classList.toggle('active', idx === index);
                });
            }
            if (e.code === 'KeyH') {
                showHitboxes = !showHitboxes;
                Object.keys(blockMeshes).forEach(key => {
                    let type = worldBlocks[key];
                    blockMeshes[key].material = showHitboxes ? wireframeMaterials[type] : materials[type];
                });
            }
            if (e.code === 'KeyM') placeBlockFromRaycast();
            if (e.code === 'KeyN') breakBlockFromRaycast();
        });

        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Collision Framework Check
        function checkCollision(pos) {
            let pMinX = pos.x - player.width / 2;
            let pMaxX = pos.x + player.width / 2;
            let pMinY = pos.y;
            let pMaxY = pos.y + player.height;
            let pMinZ = pos.z - player.width / 2;
            let pMaxZ = pos.z + player.width / 2;

            for (let x = Math.floor(pMinX); x <= Math.floor(pMaxX); x++) {
                for (let y = Math.floor(pMinY); y <= Math.floor(pMaxY); y++) {
                    for (let z = Math.floor(pMinZ); z <= Math.floor(pMaxZ); z++) {
                        if (worldBlocks[blockKey(x, y, z)]) return true;
                    }
                }
            }
            return false;
        }

        // Raycast Target Selection
        const raycaster = new THREE.Raycaster();
        const centerMouse = new THREE.Vector2(0, 0);

        function getTargetBlock() {
            raycaster.setFromCamera(centerMouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);
            if (intersects.length > 0 && intersects[0].distance < 6) {
                let intersect = intersects[0];
                let p = intersect.point.clone().sub(intersect.face.normal.clone().multiplyScalar(0.5));
                let blockPos = new THREE.Vector3(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z));
                let buildPos = blockPos.clone().add(intersect.face.normal);
                return { blockPos, buildPos };
            }
            return null;
        }

        function breakBlockFromRaycast() {
            let target = getTargetBlock();
            if (target) removeBlock(target.blockPos.x, target.blockPos.y, target.blockPos.z);
        }

        function placeBlockFromRaycast() {
            let target = getTargetBlock();
            if (target) {
                let b = target.buildPos;
                if (!worldBlocks[blockKey(b.x, b.y, b.z)]) {
                    spawnBlock(b.x, b.y, b.z, selectedBlockType);
                }
            }
        }

        // Sand Gravity Physics Clock
        let sandTimer = 0;
        function updateSandGravity() {
            Object.keys(worldBlocks).forEach(key => {
                if (worldBlocks[key] === 6) { 
                    let parts = key.split(',').map(Number);
                    let x = parts[0], y = parts[1], z = parts[2];
                    if (y > 0 && !worldBlocks[blockKey(x, y - 1, z)]) {
                        removeBlock(x, y, z);
                        spawnBlock(x, y - 1, z, 6); // Relocate sand downward
                    }
                }
            });
        }

        // Main Loop
        function update(dt) {
            if (dt > 0.1) dt = 0.1;

            sandTimer += dt;
            if(sandTimer > 0.15) {
                updateSandGravity();
                sandTimer = 0;
            }

            player.velocity.y += GRAVITY * dt;

            let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            let right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            let moveDirection = new THREE.Vector3();
            if (keys['KeyW']) moveDirection.add(forward);
            if (keys['KeyS']) moveDirection.add(forward.clone().negate());
            if (keys['KeyD']) moveDirection.add(right);
            if (keys['KeyA']) moveDirection.add(right.clone().negate());
            moveDirection.normalize().multiplyScalar(SPEED);

            // X Movement Check
            player.pos.x += moveDirection.x * dt;
            if (checkCollision(player.pos)) player.pos.x -= moveDirection.x * dt;

            // Z Movement Check
            player.pos.z += moveDirection.z * dt;
            if (checkCollision(player.pos)) player.pos.z -= moveDirection.z * dt;

            // Y Movement/Gravity Check
            player.pos.y += player.velocity.y * dt;
            player.onGround = false;
            if (checkCollision(player.pos)) {
                player.pos.y -= player.velocity.y * dt;
                if (player.velocity.y < 0) player.onGround = true;
                player.velocity.y = 0;
            }

            if (keys['Space'] && player.onGround) {
                player.velocity.y = JUMP_FORCE;
                player.onGround = false;
            }

            camera.position.copy(player.pos);
            camera.position.y += player.height - 0.2;
        }

        function animate() {
            requestAnimationFrame(animate);
            update(clock.getDelta());
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
