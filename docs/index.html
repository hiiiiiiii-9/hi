<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Craft - Perfect Generation & Physics</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #4a85e8;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <script>
        const WORLD_SIZE = 64;
        const BLOCK_SIZE = 1;
        const SEA_LEVEL = 5;
        
        const BLOCK_TYPES = {
            1: { name: 'Grass', color: '#5c8e32', hex: 0x5c8e32, transparent: false, opacity: 1.0 },
            2: { name: 'Dirt', color: '#866043', hex: 0x866043, transparent: false, opacity: 1.0 },
            3: { name: 'Stone', color: '#737373', hex: 0x737373, transparent: false, opacity: 1.0 },
            4: { name: 'Leaves', color: '#3b6e16', hex: 0x3b6e16, transparent: true, opacity: 1.0 },
            5: { name: 'Wood', color: '#9c774c', hex: 0x9c774c, transparent: false, opacity: 1.0 },
            6: { name: 'Sand', color: '#dbca98', hex: 0xdbca98, transparent: false, opacity: 1.0 },
            7: { name: 'Water', color: '#4466cc', hex: 0x4466cc, transparent: true, opacity: 0.6 }
        };

        // Water is removed from buildable inventory selection
        let selectedBlockType = 1; 
        const inventory = [1, 2, 3, 4, 5, 6]; 

        // --- CRISP RASTER TEXTURE GENERATOR ---
        function createMCTexture(id) {
            const size = 16;
            const data = new Uint8Array(size * size * 4); // RGBA map
            
            for (let i = 0; i < size * size; i++) {
                const x = i % size;
                const y = Math.floor(i / size);
                let r = 0, g = 0, b = 0, a = 255;
                let noise = Math.random() * 20 - 10;

                switch(id) {
                    case 1: // Grass block face
                        if (y < 4 || (y < 7 && Math.random() > 0.4)) {
                            r = 92 + noise; g = 142 + noise; b = 50;
                        } else {
                            r = 134 + noise; g = 96 + noise; b = 67 + noise;
                        }
                        break;
                    case 2: // Dirt core
                        r = 134 + noise; g = 96 + noise; b = 67 + noise;
                        break;
                    case 3: // Stone veins
                        let sNoise = Math.random() * 24 - 12;
                        r = 115 + sNoise; g = 115 + sNoise; b = 115 + sNoise;
                        if((x+y) % 5 === 0) { r -= 25; g -= 25; b -= 25; }
                        break;
                    case 4: // Transparent Leaves
                        r = 59 + noise; g = 110 + noise; b = 22;
                        if (Math.random() > 0.82) { r=0; g=0; b=0; a=0; } // True alpha cutout holes
                        break;
                    case 5: // Wood Trunk
                        if (x === 0 || x === 15 || y % 4 === 0) { r = 75; g = 50; b = 30; } 
                        else { r = 156 + noise; g = 119 + noise; b = 76; }
                        break;
                    case 6: // Sand grit
                        r = 219 + noise; g = 202 + noise; b = 152;
                        break;
                    case 7: // Water
                        r = 50; g = 90 + Math.sin(x*0.5)*5; b = 215 + noise;
                        break;
                }

                const stride = i * 4;
                data[stride]     = Math.max(0, Math.min(255, r));
                data[stride + 1] = Math.max(0, Math.min(255, g));
                data[stride + 2] = Math.max(0, Math.min(255, b));
                data[stride + 3] = a;
            }
            
            const texture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
            // Block fuzzy linear interpolation stretching (fixes blur)
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            texture.needsUpdate = true;
            return texture;
        }

        // --- CORE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4a85e8);
        scene.fog = new THREE.FogExp2(0x4a85e8, 0.035);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.35);
        directionalLight.position.set(20, 40, 10);
        scene.add(directionalLight);

        const worldBlocks = {}; 
        const blockMeshes = {}; 
        function blockKey(x, y, z) { return `${x},${y},${z}`; }

        const materials = {};
        const wireframeMaterials = {};
        
        Object.keys(BLOCK_TYPES).forEach(id => {
            materials[id] = new THREE.MeshLambertMaterial({ 
                map: createMCTexture(parseInt(id)),
                transparent: BLOCK_TYPES[id].transparent,
                opacity: BLOCK_TYPES[id].opacity,
                side: THREE.DoubleSide
            });
            wireframeMaterials[id] = new THREE.MeshBasicMaterial({ color: BLOCK_TYPES[id].hex, wireframe: true });
        });

        const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

        // --- SHARP 2D SPRITE HUD OVERLAY ---
        const hudCanvas = document.createElement('canvas');
        hudCanvas.width = 1024; hudCanvas.height = 1024;
        const hudCtx = hudCanvas.getContext('2d');
        const hudTexture = new THREE.CanvasTexture(hudCanvas);
        
        // Ensure HUD text elements maintain razor sharp rendering profiles
        hudTexture.magFilter = THREE.NearestFilter;
        hudTexture.minFilter = THREE.NearestFilter;

        const hudSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: hudTexture }));
        const hudCamera = new THREE.OrthographicCamera(-512, 512, 512, -512, 1, 10);
        hudSprite.position.set(0, 0, -1); hudSprite.scale.set(1024, 1024, 1);
        const hudScene = new THREE.Scene(); hudScene.add(hudSprite);

        function drawHUD() {
            hudCtx.clearRect(0, 0, 1024, 1024);
            
            // Crosshair
            hudCtx.strokeStyle = 'rgba(255,255,255,0.9)';
            hudCtx.lineWidth = 4;
            hudCtx.beginPath();
            hudCtx.moveTo(512 - 12, 512); hudCtx.lineTo(512 + 12, 512);
            hudCtx.moveTo(512, 512 - 12); hudCtx.lineTo(512, 512 + 12);
            hudCtx.stroke();

            // Instruction Control Box
            hudCtx.fillStyle = 'rgba(10, 10, 15, 0.88)';
            hudCtx.fillRect(20, 20, 440, 230);
            hudCtx.fillStyle = '#5c8e32';
            hudCtx.font = 'bold 18px Courier New';
            hudCtx.fillText("MINECRAFT 3D Engine Engine", 35, 50);
            hudCtx.fillStyle = 'white';
            hudCtx.font = '15px Courier New';
            hudCtx.fillText("• Click Screen : Lock Cursor Context", 35, 85);
            hudCtx.fillText("• Hold SHIFT   : Trackpad Look Fallback", 35, 115);
            hudCtx.fillText("• WASD / SPACE : Move / Swim / Jump", 35, 145);
            hudCtx.fillText("• M / N Key    : Place Block / Break Block", 35, 175);
            hudCtx.fillText("• 1 to 6 / H   : Change Slot / Toggle Wireframe", 35, 205);

            // Inventory Hotbar Drawing (Excludes un-placable fluid water)
            let startX = 512 - (6 * 70) / 2;
            for (let i = 0; i < 6; i++) {
                let x = startX + (i * 70); let y = 920;
                let bId = inventory[i];
                let isActive = (bId === selectedBlockType);

                hudCtx.fillStyle = isActive ? 'rgba(255, 255, 255, 0.45)' : 'rgba(0, 0, 0, 0.75)';
                hudCtx.fillRect(x, y, 64, 64);
                hudCtx.strokeStyle = isActive ? '#ffffff' : '#444444';
                hudCtx.lineWidth = isActive ? 4 : 2;
                hudCtx.strokeRect(x, y, 64, 64);

                hudCtx.fillStyle = BLOCK_TYPES[bId].color;
                hudCtx.fillRect(x + 8, y + 8, 16, 16);

                hudCtx.fillStyle = 'white';
                hudCtx.font = 'bold 12px Courier New';
                hudCtx.fillText(BLOCK_TYPES[bId].name, x + 5, y + 48);
                hudCtx.fillText(i + 1, x + 48, y + 20);
            }
            hudTexture.needsUpdate = true;
        }

        // --- NATURAL WORLD LAYER MATRIX GENERATOR ---
        const rawMapData = {};
        
        function buildNaturalTerrain() {
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    
                    let isPlains = x > 28;
                    let surfaceHeight = SEA_LEVEL;

                    if (isPlains) {
                        // Coherent cosine curve rolling hills pattern
                        surfaceHeight = Math.floor((Math.sin(x * 0.12) * Math.cos(z * 0.12) * 3) + 9);
                    } else {
                        // Soft beach incline heading out into oceanic beds
                        surfaceHeight = Math.floor(SEA_LEVEL + (x - 28) * 0.3);
                    }
                    if(surfaceHeight < 1) surfaceHeight = 1;

                    // Absolute vertical stack execution (Stops awkward underground air chambers)
                    for (let y = 0; y <= Math.max(surfaceHeight, SEA_LEVEL); y++) {
                        let type = 0;
                        if (y <= surfaceHeight) {
                            if (isPlains) {
                                if (y === surfaceHeight) type = 1;      // Grass top cover
                                else if (y > surfaceHeight - 3) type = 2; // Strict Dirt underlayment
                                else type = 3;                           // Solid foundational stone core
                            } else {
                                type = 6; // Sandy coast substrate
                            }
                        } else if (y <= SEA_LEVEL) {
                            type = 7; // Natural fluid water filling valleys
                        }
                        if(type > 0) rawMapData[blockKey(x, y, z)] = type;
                    }

                    // Natural tree structures generated strictly on valid plains sector surfaces
                    if (isPlains && x < WORLD_SIZE-3 && z > 2 && z < WORLD_SIZE-3 && Math.random() < 0.025) {
                        if (rawMapData[blockKey(x, surfaceHeight, z)] === 1) {
                            let trunk = 4 + Math.floor(Math.random()*2);
                            for(let t=1; t<=trunk; t++) rawMapData[blockKey(x, surfaceHeight+t, z)] = 5;
                            let lb = surfaceHeight + trunk - 1;
                            for(let lx=-2; lx<=2; lx++) {
                                for(let lz=-2; lz<=2; lz++) {
                                    for(let ly=0; ly<=3; ly++) {
                                        if (Math.abs(lx)===2 && Math.abs(lz)===2 && ly>1) continue;
                                        let k = blockKey(x+lx, lb+ly, z+lz);
                                        if(!rawMapData[k]) rawMapData[k] = 4;
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        // --- MESH FACE OCClUSION CULLER ---
        function renderCullEngine() {
            // Wipe existing old scene structures clean
            Object.keys(blockMeshes).forEach(k => { if(blockMeshes[k]) scene.remove(blockMeshes[k]); });
            
            Object.keys(rawMapData).forEach(key => {
                let parts = key.split(',').map(Number);
                let x = parts[0], y = parts[1], z = parts[2];
                let type = rawMapData[key];

                // Face visibility verification checks against adjacent items
                let hidden = rawMapData[blockKey(x+1, y, z)] &&
                             rawMapData[blockKey(x-1, y, z)] &&
                             rawMapData[blockKey(x, y+1, z)] &&
                             rawMapData[blockKey(x, y-1, z)] &&
                             rawMapData[blockKey(x, y, z+1)] &&
                             rawMapData[blockKey(x, y, z-1)];

                // Water and leaves always trigger rendering logic to retain transparency effects
                if (!hidden || type === 7 || type === 4) { 
                    worldBlocks[key] = type;
                    const mesh = new THREE.Mesh(geometry, materials[type]);
                    mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
                    scene.add(mesh);
                    blockMeshes[key] = mesh;
                } else {
                    worldBlocks[key] = type; 
                }
            });
        }

        buildNaturalTerrain();
        renderCullEngine();

        function spawnBlock(x, y, z, type) {
            rawMapData[blockKey(x, y, z)] = type;
            renderCullEngine();
        }

        function removeBlock(x, y, z) {
            delete rawMapData[blockKey(x, y, z)];
            delete worldBlocks[blockKey(x, y, z)];
            renderCullEngine();
        }

        // --- CELLULAR AUTOMATA FLUID WATER SPREAD SCRIPT ---
        let fluidTicks = 0;
        function processWaterFlow() {
            let updates = [];
            Object.keys(rawMapData).forEach(key => {
                if (rawMapData[key] === 7) { // Identify source water voxels
                    let parts = key.split(',').map(Number);
                    let x = parts[0], y = parts[1], z = parts[2];

                    let down = blockKey(x, y - 1, z);
                    let left = blockKey(x - 1, y, z);
                    let right = blockKey(x + 1, y, z);
                    let forward = blockKey(x, y, z - 1);
                    let back = blockKey(x, y, z + 1);

                    // 1. Vertical expansion acceleration downward
                    if (y > 0 && !rawMapData[down]) {
                        updates.push({x, y: y-1, z, type: 7});
                    } else {
                        // 2. Horizontal surface dispersion spreading outward
                        if (!rawMapData[left] && x > 0) updates.push({x: x-1, y, z, type: 7});
                        if (!rawMapData[right] && x < WORLD_SIZE-1) updates.push({x: x+1, y, z, type: 7});
                        if (!rawMapData[forward] && z > 0) updates.push({x, y, z: z-1, type: 7});
                        if (!rawMapData[back] && z < WORLD_SIZE-1) updates.push({x, y, z: z+1, type: 7});
                    }
                }
            });

            if(updates.length > 0) {
                updates.forEach(u => { rawMapData[blockKey(u.x, u.y, u.z)] = u.type; });
                renderCullEngine();
            }
        }

        // --- CONTROL LAYOUT CONFIG ---
        let player = {
            pos: new THREE.Vector3(45, 15, 32),
            velocity: new THREE.Vector3(),
            width: 0.5,
            height: 1.8,
            onGround: false
        };
        camera.position.copy(player.pos).y += player.height - 0.2;

        const GRAVITY = -20.0;
        const JUMP_FORCE = 7.5;
        const SPEED = 5.0;
        let clock = new THREE.Clock();

        let keys = {};
        let isLocked = false;

        window.addEventListener('click', () => {
            window.focus();
            document.body.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
        });

        let pitch = 0, yaw = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked && !keys['ShiftLeft'] && !keys['ShiftRight']) return;
            yaw -= e.movementX * 0.003;
            pitch -= e.movementY * 0.003;
            pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        let showHitboxes = false;
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].includes(e.code)) {
                selectedBlockType = inventory[parseInt(e.key) - 1];
                drawHUD();
            }
            if (e.code === 'KeyH') {
                showHitboxes = !showHitboxes;
                Object.keys(blockMeshes).forEach(key => {
                    let type = worldBlocks[key];
                    if(blockMeshes[key]) blockMeshes[key].material = showHitboxes ? wireframeMaterials[type] : materials[type];
                });
            }
            if (e.code === 'KeyM') placeBlockFromRaycast();
            if (e.code === 'KeyN') breakBlockFromRaycast();
        });

        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function checkCollision(pos) {
            let pMinX = pos.x - player.width / 2; let pMaxX = pos.x + player.width / 2;
            let pMinY = pos.y; let pMaxY = pos.y + player.height;
            let pMinZ = pos.z - player.width / 2; let pMaxZ = pos.z + player.width / 2;

            for (let x = Math.floor(pMinX); x <= Math.floor(pMaxX); x++) {
                for (let y = Math.floor(pMinY); y <= Math.floor(pMaxY); y++) {
                    for (let z = Math.floor(pMinZ); z <= Math.floor(pMaxZ); z++) {
                        let t = worldBlocks[blockKey(x, y, z)];
                        if (t && t !== 7) return true; // Water doesn't stop solid movement vectors
                    }
                }
            }
            return false;
        }

        const raycaster = new THREE.Raycaster();
        const centerMouse = new THREE.Vector2(0, 0);

        function getTargetBlock() {
            raycaster.setFromCamera(centerMouse, camera);
            const targets = [];
            Object.keys(blockMeshes).forEach(k => { if(blockMeshes[k]) targets.push(blockMeshes[k]); });
            
            const intersects = raycaster.intersectObjects(targets);
            if (intersects.length > 0 && intersects[0].distance < 6) {
                let intersect = intersects[0];
                let p = intersect.point.clone().sub(intersect.face.normal.clone().multiplyScalar(0.5));
                let blockPos = new THREE.Vector3(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z));
                let buildPos = blockPos.clone().add(intersect.face.normal);
                return { blockPos, buildPos };
            }
            return null;
        }

        function breakBlockFromRaycast() {
            let target = getTargetBlock();
            if (target) removeBlock(target.blockPos.x, target.blockPos.y, target.blockPos.z);
        }

        function placeBlockFromRaycast() {
            let target = getTargetBlock();
            if (target) {
                let b = target.buildPos;
                if (!worldBlocks[blockKey(b.x, b.y, b.z)]) spawnBlock(b.x, b.y, b.z, selectedBlockType);
            }
        }

        let sandTimer = 0;
        function updateSandGravity() {
            Object.keys(worldBlocks).forEach(key => {
                if (worldBlocks[key] === 6) { 
                    let parts = key.split(',').map(Number);
                    let x = parts[0], y = parts[1], z = parts[2];
                    let belowKey = blockKey(x, y - 1, z);
                    if (y > 0 && (!worldBlocks[belowKey] || worldBlocks[belowKey] === 7)) {
                        removeBlock(x, y, z);
                        spawnBlock(x, y - 1, z, 6);
                    }
                }
            });
        }

        // --- MAIN RENDER GAME TICK ---
        function update(dt) {
            if (dt > 0.1) dt = 0.1;

            sandTimer += dt;
            if(sandTimer > 0.15) {
                updateSandGravity();
                sandTimer = 0;
            }

            fluidTicks += dt;
            if (fluidTicks > 0.3) {
                processWaterFlow();
                fluidTicks = 0;
            }

            // Submerged / Swim checks
            let insideBlock = worldBlocks[blockKey(Math.floor(player.pos.x), Math.floor(player.pos.y + 0.6), Math.floor(player.pos.z))];
            let inWater = (insideBlock === 7);

            // Water physics modifications
            player.velocity.y += inWater ? (GRAVITY * 0.22) * dt : GRAVITY * dt;
            if(inWater && player.velocity.y < -2.0) player.velocity.y = -2.0;

            let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            let right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            let moveDirection = new THREE.Vector3();
            if (keys['KeyW']) moveDirection.add(forward);
            if (keys['KeyS']) moveDirection.add(forward.clone().negate());
            if (keys['KeyD']) moveDirection.add(right);
            if (keys['KeyA']) moveDirection.add(right.clone().negate());
            moveDirection.normalize().multiplyScalar(inWater ? SPEED * 0.45 : SPEED);

            player.pos.x += moveDirection.x * dt;
            if (checkCollision(player.pos)) player.pos.x -= moveDirection.x * dt;

            player.pos.z += moveDirection.z * dt;
            if (checkCollision(player.pos)) player.pos.z -= moveDirection.z * dt;

            player.pos.y += player.velocity.y * dt;
            player.onGround = false;
            if (checkCollision(player.pos)) {
                player.pos.y -= player.velocity.y * dt;
                if (player.velocity.y < 0) player.onGround = true;
                player.velocity.y = 0;
            }

            if (keys['Space']) {
                if (player.onGround) { player.velocity.y = JUMP_FORCE; player.onGround = false; }
                else if (inWater) { player.velocity.y = 2.2; } // Rise up slowly while swimming
            }

            camera.position.copy(player.pos).y += player.height - 0.2;
        }

        drawHUD();

        function animate() {
            requestAnimationFrame(animate);
            update(clock.getDelta());
            
            renderer.clear();
            renderer.render(scene, camera);
            renderer.clearDepth();
            renderer.render(hudScene, hudCamera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.autoClear = false;
        animate();
    </script>
</body>
</html>
