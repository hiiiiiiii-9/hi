<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Web Craft - Advanced Physics</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white; mix-blend-mode: difference;
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; pointer-events: none;
        }
        .slot {
            width: 50px; height: 50px; margin: 0 3px; border: 2px solid #555;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 11px; text-shadow: 1px 1px black; position: relative;
        }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.2); }
        .slot-num { position: absolute; top: 2px; left: 4px; font-size: 10px; }
        #instructions {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
            color: white; padding: 10px; border-radius: 5px; font-size: 12px; line-height: 1.4;
        }
        /* Underwater screen overlay */
        #underwater-tint {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 60, 200, 0.35); pointer-events: none; display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="underwater-tint"></div>
    <div id="crosshair"></div>
    <div id="instructions">
        <strong>Click screen to Lock Mouse</strong><br>
        WASD = Move | Space = Jump / Swim Up<br>
        N = Place Block | M = Break Block<br>
        1-6 = Inventory Slots<br>
        H = Toggle Hitboxes/Wireframe<br>
        ESC = Unlock Mouse
    </div>
    <div id="hotbar">
        <div class="slot active" id="slot1"><span class="slot-num">1</span>Grass</div>
        <div class="slot" id="slot2"><span class="slot-num">2</span>Dirt</div>
        <div class="slot" id="slot3"><span class="slot-num">3</span>Stone</div>
        <div class="slot" id="slot4"><span class="slot-num">4</span>Sand</div>
        <div class="slot" id="slot5"><span class="slot-num">5</span>Wood</div>
        <div class="slot" id="slot6"><span class="slot-num">6</span>Leaves</div>
    </div>

    <script>
        // --- Game Configuration ---
        const WORLD_SIZE = 80;
        const WORLD_DEPTH = 25;
        const WATER_LEVEL = 10;
        const BLOCK_SIZE = 1;

        const BLOCK_TYPES = {
            AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, SAND: 4, WOOD: 5, LEAVES: 6, WATER: 7
        };

        const BLOCK_COLORS = {
            [BLOCK_TYPES.GRASS]: 0x5b8731,
            [BLOCK_TYPES.DIRT]: 0x866043,
            [BLOCK_TYPES.STONE]: 0x7a7a7a,
            [BLOCK_TYPES.SAND]: 0xded09a,
            [BLOCK_TYPES.WOOD]: 0x735135,
            [BLOCK_TYPES.LEAVES]: 0x3b5e2b,
            [BLOCK_TYPES.WATER]: 0x4060c0
        };

        const slotMapping = [BLOCK_TYPES.GRASS, BLOCK_TYPES.DIRT, BLOCK_TYPES.STONE, BLOCK_TYPES.SAND, BLOCK_TYPES.WOOD, BLOCK_TYPES.LEAVES];
        let activeSlotIndex = 0;

        // Flat performance architecture array
        const world = new Uint8Array(WORLD_SIZE * WORLD_DEPTH * WORLD_SIZE);
        function getBlockIndex(x, y, z) {
            return x + y * WORLD_SIZE + z * WORLD_SIZE * WORLD_DEPTH;
        }
        function getBlock(x, y, z) {
            if (x < 0 || x >= WORLD_SIZE || y < 0 || y >= WORLD_DEPTH || z < 0 || z >= WORLD_SIZE) return BLOCK_TYPES.AIR;
            return world[getBlockIndex(x, y, z)];
        }
        function setBlock(x, y, z, type) {
            if (x >= 0 && x < WORLD_SIZE && y >= 0 && y < WORLD_DEPTH && z >= 0 && z < WORLD_SIZE) {
                world[getBlockIndex(x, y, z)] = type;
            }
        }

        // --- Setup Three.js Context ---
        const scene = new THREE.Scene();
        const skyColor = 0xbfd1e5;
        scene.background = new THREE.Color(skyColor);
        scene.fog = new THREE.FogExp2(skyColor, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(30, 50, 10);
        scene.add(directionalLight);

        const materials = {};
        function getMaterial(type, wireframe = false) {
            const key = `${type}_${wireframe}`;
            if (!materials[key]) {
                let opacity = 1.0;
                let transparent = false;
                if (type === BLOCK_TYPES.LEAVES) { transparent = true; opacity = 0.85; }
                else if (type === BLOCK_TYPES.WATER) { transparent = true; opacity = 0.65; }
                
                materials[key] = new THREE.MeshLambertMaterial({
                    color: BLOCK_COLORS[type],
                    wireframe: wireframe,
                    transparent: transparent,
                    opacity: opacity,
                    side: type === BLOCK_TYPES.LEAVES || type === BLOCK_TYPES.WATER ? THREE.DoubleSide : THREE.FrontSide
                });
            }
            return materials[key];
        }

        // --- Clean Biome Generation (No Wild Mixing) ---
        function generateWorld() {
            // Split map into unified, large regions: x < 35 is deep water/beach, x >= 35 is plains inland
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    
                    let isOceanEdge = (x < 6 || x > WORLD_SIZE - 7 || z < 6 || z > WORLD_SIZE - 7);
                    let isBeach = (x < 35) || isOceanEdge;
                    
                    // Flatten center of map completely for player spawn point
                    let isSpawnZone = (x > 36 && x < 44 && z > 36 && z < 44);

                    let surfaceY = 12; // Flat plains base height
                    if (isSpawnZone) {
                        surfaceY = 12; // Flat ground baseline
                    } else if (isOceanEdge) {
                        surfaceY = 6;  // Deep marine shelf
                    } else if (isBeach) {
                        surfaceY = 9;  // Lower beach shelf
                    }

                    let dirtDepth = 3;
                    let stoneDepth = 5;
                    let currentY = surfaceY;

                    if (isBeach) {
                        // Beach stack: 2 Sand -> 2 Dirt -> 5 Stone -> Void
                        for (let i = 0; i < 2; i++) setBlock(x, currentY--, z, BLOCK_TYPES.SAND);
                        for (let i = 0; i < 2; i++) setBlock(x, currentY--, z, BLOCK_TYPES.DIRT);
                        for (let i = 0; i < stoneDepth; i++) setBlock(x, currentY--, z, BLOCK_TYPES.STONE);
                    } else {
                        // Plains stack: 1 Grass -> 3 Dirt -> 5 Stone -> Void
                        setBlock(x, currentY--, z, BLOCK_TYPES.GRASS);
                        for (let i = 0; i < dirtDepth; i++) setBlock(x, currentY--, z, BLOCK_TYPES.DIRT);
                        for (let i = 0; i < stoneDepth; i++) setBlock(x, currentY--, z, BLOCK_TYPES.STONE);
                    }

                    // Fill water up to baseline
                    for (let y = 0; y <= WATER_LEVEL; y++) {
                        if (getBlock(x, y, z) === BLOCK_TYPES.AIR) {
                            setBlock(x, y, z, BLOCK_TYPES.WATER);
                        }
                    }

                    // Trees only on dry plains outside the flat spawn zone
                    if (!isBeach && !isSpawnZone && Math.random() < 0.04) {
                        generateTree(x, surfaceY + 1, z);
                    }
                }
            }
        }

        function generateTree(tx, ty, tz) {
            let trunkHeight = 4;
            for (let i = 0; i < trunkHeight; i++) setBlock(tx, ty + i, tz, BLOCK_TYPES.WOOD);
            let ly = ty + trunkHeight - 1;
            for (let ox = -2; ox <= 2; ox++) {
                for (let oz = -2; oz <= 2; oz++) {
                    for (let oy = 0; oy <= 2; oy++) {
                        if (Math.abs(ox) === 2 && Math.abs(oz) === 2 && oy > 0) continue;
                        if (getBlock(tx + ox, ly + oy, tz + oz) === BLOCK_TYPES.AIR) {
                            setBlock(tx + ox, ly + oy, tz + oz, BLOCK_TYPES.LEAVES);
                        }
                    }
                }
            }
        }

        // --- Fast Instanced Mesh Engine ---
        let showWireframe = false;
        let worldMeshGroup = new THREE.Group();
        scene.add(worldMeshGroup);

        function updateVisualWorld() {
            while(worldMeshGroup.children.length > 0){
                let obj = worldMeshGroup.children[0];
                worldMeshGroup.remove(obj);
                obj.geometry.dispose();
            }

            const instancedData = {};
            for(let key in BLOCK_TYPES) {
                if(BLOCK_TYPES[key] !== BLOCK_TYPES.AIR) instancedData[BLOCK_TYPES[key]] = [];
            }

            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let y = 0; y < WORLD_DEPTH; y++) {
                    for (let z = 0; z < WORLD_SIZE; z++) {
                        let type = getBlock(x, y, z);
                        if (type !== BLOCK_TYPES.AIR) {
                            let top = getBlock(x, y + 1, z);
                            let bottom = getBlock(x, y - 1, z);
                            let left = getBlock(x - 1, y, z);
                            let right = getBlock(x + 1, y, z);
                            let front = getBlock(x, y, z + 1);
                            let back = getBlock(x, y, z - 1);

                            let trans = (t) => t === BLOCK_TYPES.AIR || t === BLOCK_TYPES.WATER || t === BLOCK_TYPES.LEAVES;

                            if (trans(top) || trans(bottom) || trans(left) || trans(right) || trans(front) || trans(back) || 
                                type === BLOCK_TYPES.WATER || type === BLOCK_TYPES.LEAVES) {
                                instancedData[type].push(new THREE.Vector3(x, y, z));
                            }
                        }
                    }
                }
            }

            const boxGeom = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            for(let type in instancedData) {
                let positions = instancedData[type];
                if(positions.length === 0) continue;

                let mat = getMaterial(parseInt(type), showWireframe);
                let instMesh = new THREE.InstancedMesh(boxGeom, mat, positions.length);
                let dummy = new THREE.Object3D();

                for(let i=0; i<positions.length; i++) {
                    dummy.position.copy(positions[i]);
                    dummy.updateMatrix();
                    instMesh.setMatrixAt(i, dummy.matrix);
                }
                worldMeshGroup.add(instMesh);
            }
        }

        // --- Sand Gravity & Water Flow Engine ---
        function simulationStep() {
            let changed = false;

            // 1. Process Sand Block Gravity (Scan from bottom up to execute clean falls)
            for (let y = 1; y < WORLD_DEPTH; y++) {
                for (let x = 0; x < WORLD_SIZE; x++) {
                    for (let z = 0; z < WORLD_SIZE; z++) {
                        if (getBlock(x, y, z) === BLOCK_TYPES.SAND) {
                            let blockBelow = getBlock(x, y - 1, z);
                            // Sand falls through both air and water layers
                            if (blockBelow === BLOCK_TYPES.AIR || blockBelow === BLOCK_TYPES.WATER) {
                                setBlock(x, y - 1, z, BLOCK_TYPES.SAND);
                                setBlock(x, y, z, blockBelow); // Displaces space cleanly
                                changed = true;
                            }
                        }
                    }
                }
            }

            // 2. Process Water Flow
            let waterUpdates = [];
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let y = 1; y < WORLD_DEPTH; y++) {
                    for (let z = 0; z < WORLD_SIZE; z++) {
                        if (getBlock(x, y, z) === BLOCK_TYPES.WATER) {
                            if (getBlock(x, y - 1, z) === BLOCK_TYPES.AIR) {
                                waterUpdates.push({x, y: y-1, z});
                                changed = true;
                            } else if (getBlock(x, y - 1, z) !== BLOCK_TYPES.WATER) {
                                let sides = [[1,0], [-1,0], [0,1], [0,-1]];
                                sides.forEach(([dx, dz]) => {
                                    if (getBlock(x + dx, y, z + dz) === BLOCK_TYPES.AIR) {
                                        waterUpdates.push({x: x + dx, y, z: z + dz});
                                        changed = true;
                                    }
                                });
                            }
                        }
                    }
                }
            }
            waterUpdates.forEach(up => setBlock(up.x, up.y, up.z, BLOCK_TYPES.WATER));

            if(changed) updateVisualWorld();
        }
        setInterval(simulationStep, 200);

        // --- Player Attributes & Movement State ---
        let player = {
            pos: new THREE.Vector3(40, 15, 40), // Spawns right above the flat ground marker
            velocity: new THREE.Vector3(),
            walkSpeed: 0.10,
            swimSpeed: 0.05,
            gravity: 0.012,
            waterGravity: 0.003, // Slower sinking when floating inside water volume
            jumpForce: 0.20,
            swimUpForce: 0.08,
            height: 1.6,
            radius: 0.3,
            onGround: false,
            isSubmerged: false
        };

        camera.position.copy(player.pos);
        let keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if(['1','2','3','4','5','6'].includes(e.key)) {
                activeSlotIndex = parseInt(e.key) - 1;
                document.querySelectorAll('.slot').forEach((s, idx) => {
                    s.classList.toggle('active', idx === activeSlotIndex);
                });
            }
            if(e.key.toLowerCase() === 'h') { showWireframe = !showWireframe; updateVisualWorld(); }
            if(e.key.toLowerCase() === 'm') breakBlock();
            if(e.key.toLowerCase() === 'n') placeBlock();
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        let isLocked = false;
        document.body.addEventListener('click', () => { if(!isLocked) document.body.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => { isLocked = (document.pointerLockElement === document.body); });

        let pitch = 0, yaw = 0;
        window.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.0025;
            pitch -= e.movementY * 0.0025;
            pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        // --- Custom AABB Solid Collision System ---
        function checkCollision(pos) {
            let minX = Math.floor(pos.x - player.radius);
            let maxX = Math.floor(pos.x + player.radius);
            let minY = Math.floor(pos.y - player.height);
            let maxY = Math.floor(pos.y + 0.1);
            let minZ = Math.floor(pos.z - player.radius);
            let maxZ = Math.floor(pos.z + player.radius);

            for(let x = minX; x <= maxX; x++) {
                for(let y = minY; y <= maxY; y++) {
                    for(let z = minZ; z <= maxZ; z++) {
                        let block = getBlock(x, y, z);
                        // Player collides with solid blocks (Not Air and Not Water)
                        if(block !== BLOCK_TYPES.AIR && block !== BLOCK_TYPES.WATER) return true;
                    }
                }
            }
            return false;
        }

        function getTargetBlock() {
            let raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            let target = null;
            let minDist = 5;

            for (let x = Math.floor(player.pos.x - 6); x < player.pos.x + 6; x++) {
                for (let y = Math.floor(player.pos.y - 6); y < player.pos.y + 6; y++) {
                    for (let z = Math.floor(player.pos.z - 6); z < player.pos.z + 6; z++) {
                        let b = getBlock(x, y, z);
                        if (b !== BLOCK_TYPES.AIR && b !== BLOCK_TYPES.WATER) {
                            let bbox = new THREE.Box3(
                                new THREE.Vector3(x - 0.5, y - 0.5, z - 0.5),
                                new THREE.Vector3(x + 0.5, y + 0.5, z + 0.5)
                            );
                            let intersect = raycaster.ray.intersectBox(bbox, new THREE.Vector3());
                            if (intersect) {
                                let d = camera.position.distanceTo(intersect);
                                if (d < minDist) {
                                    minDist = d;
                                    let normal = new THREE.Vector3();
                                    let diff = intersect.clone().sub(new THREE.Vector3(x, y, z));
                                    if (Math.abs(diff.x) > Math.abs(diff.y) && Math.abs(diff.x) > Math.abs(diff.z)) normal.set(Math.sign(diff.x), 0, 0);
                                    else if (Math.abs(diff.y) > Math.abs(diff.x) && Math.abs(diff.y) > Math.abs(diff.z)) normal.set(0, Math.sign(diff.y), 0);
                                    else normal.set(0, 0, Math.sign(diff.z));

                                    target = { coord: new THREE.Vector3(x, y, z), normal: normal };
                                }
                            }
                        }
                    }
                }
            }
            return target;
        }

        function breakBlock() {
            let target = getTargetBlock();
            if(target) {
                setBlock(target.coord.x, target.coord.y, target.coord.z, BLOCK_TYPES.AIR);
                updateVisualWorld();
            }
        }

        function placeBlock() {
            let target = getTargetBlock();
            if(target) {
                let p = target.coord.clone().add(target.normal);
                if(p.x === Math.floor(player.pos.x) && p.z === Math.floor(player.pos.z) && 
                   (p.y === Math.floor(player.pos.y) || p.y === Math.floor(player.pos.y) - 1)) return;

                setBlock(p.x, p.y, p.z, slotMapping[activeSlotIndex]);
                updateVisualWorld();
            }
        }

        // --- Core Loop with Dual Mechanics (Walking/Swimming) ---
        function animate() {
            requestAnimationFrame(animate);

            if (isLocked) {
                // Check if current camera head position is underneath the water matrix height
                let headBlock = getBlock(Math.floor(player.pos.x), Math.floor(player.pos.y), Math.floor(player.pos.z));
                let bodyBlock = getBlock(Math.floor(player.pos.x), Math.floor(player.pos.y - 1), Math.floor(player.pos.z));
                
                let inWater = (headBlock === BLOCK_TYPES.WATER || bodyBlock === BLOCK_TYPES.WATER);
                player.isSubmerged = (headBlock === BLOCK_TYPES.WATER);

                // UI Fog and tint modulation depending on position
                if(player.isSubmerged) {
                    document.getElementById('underwater-tint').style.display = 'block';
                    scene.fog.color.setHex(0x103080);
                    scene.fog.density = 0.08;
                } else {
                    document.getElementById('underwater-tint').style.display = 'none';
                    scene.fog.color.setHex(skyColor);
                    scene.fog.density = 0.03;
                }

                let currentSpeed = inWater ? player.swimSpeed : player.walkSpeed;

                let moveVector = new THREE.Vector3();
                if (keys['w']) moveVector.z -= 1;
                if (keys['s']) moveVector.z += 1;
                if (keys['a']) moveVector.x -= 1;
                if (keys['d']) moveVector.x += 1;
                moveVector.normalize();

                let camYaw = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ').y;
                let forward = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw)).negate();
                let right = new THREE.Vector3(-forward.z, 0, forward.x);

                let intentVelocity = new THREE.Vector3()
                    .addScaledVector(forward, -moveVector.z)
                    .addScaledVector(right, moveVector.x)
                    .setLength(currentSpeed);

                player.velocity.x = intentVelocity.x;
                player.velocity.z = intentVelocity.z;

                // Vertical Fluid Dampening Logic
                if (inWater) {
                    player.velocity.y -= player.waterGravity;
                    // Clamp maximum downward sink speed
                    if(player.velocity.y < -0.04) player.velocity.y = -0.04;

                    // Spacebar executes an upward swimming thrust
                    if (keys[' ']) {
                        player.velocity.y = player.swimUpForce;
                    }
                } else {
                    // Regular Land Gravity Execution
                    player.velocity.y -= player.gravity;
                    if (keys[' '] && player.onGround) {
                        player.velocity.y = player.jumpForce;
                        player.onGround = false;
                    }
                }

                // Apply positional updates against collision limits
                let nextPos = player.pos.clone();
                nextPos.x += player.velocity.x;
                if (checkCollision(nextPos)) { nextPos.x -= player.velocity.x; player.velocity.x = 0; }

                nextPos.y += player.velocity.y;
                if (checkCollision(nextPos)) {
                    if (player.velocity.y < 0) player.onGround = true;
                    nextPos.y -= player.velocity.y;
                    player.velocity.y = 0;
                } else { player.onGround = false; }

                nextPos.z += player.velocity.z;
                if (checkCollision(nextPos)) { nextPos.z -= player.velocity.z; player.velocity.z = 0; }

                if(nextPos.y < -5) {
                    nextPos.set(40, 15, 40);
                    player.velocity.set(0,0,0);
                }

                player.pos.copy(nextPos);
                camera.position.copy(player.pos);
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        generateWorld();
        updateVisualWorld();
        animate();
    </script>
</body>
</html>
